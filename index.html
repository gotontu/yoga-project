<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Yoga Master - 智能瑜伽綜合版</title>
    
    <!-- MediaPipe 函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- 圖表函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>

    <!-- 1. 登入與歡迎畫面 -->
    <div id="landing-page">
        <h1 class="hero-title">AI Yoga Master</h1>
        <p id="user-welcome" class="hero-subtitle">請先登入以記錄你的練習成果</p>
        <button id="login-btn" class="start-btn btn-google">使用 Google 帳號登入</button>
        <!-- 🌟 加回開始體驗按鈕 (登入成功後會自動顯現) -->
        <button id="start-btn" class="start-btn" style="display: none; margin-top: 15px;">開始體驗</button>
    </div>

    <!-- 2. 首頁大廳 (Home View) -->
    <div id="home-view" style="display: none;">
        <!-- 上方功能導覽列 -->
        <header class="top-navbar">
            <div class="nav-brand">
                <h2>🧘 AI Yoga Master</h2>
                <span id="user-display" class="user-badge">使用者：載入中...</span>
            </div>
            <div class="nav-actions">
                <button id="btn-profile" class="nav-btn btn-purple">👤 個人中心</button>
                <button id="toggle-history-btn" class="nav-btn btn-gray">📜 歷史紀錄</button>
                <button id="toggle-leaderboard-btn" class="nav-btn btn-orange">🏆 全球排行榜</button>
                <button id="logout-btn" class="nav-btn btn-danger">🚪 登出</button>
            </div>
        </header>

        <!-- 彈出抽屜區塊 (個人中心 / 歷史紀錄 / 排行榜) -->
        <div id="overlay-panels-container">
            <!-- 個人中心 -->
            <div id="profile-container" class="dashboard-panel" style="display: none;">
                <h2>👤 我的瑜珈專屬檔案</h2>
                <div class="profile-card">
                    <img id="profile-avatar" src="" alt="Avatar">
                    <div>
                        <h3 id="profile-name">載入中...</h3>
                        <span id="profile-rank" class="rank-tag">判定中...</span>
                    </div>
                </div>
                <div class="profile-stats-grid">
                    <div class="stat-box"><div>累積積分</div><strong id="profile-total-score">0</strong></div>
                    <div class="stat-box"><div>練習天數</div><strong id="profile-days-count">0</strong></div>
                    <div class="stat-box"><div>Perfect 總數</div><strong id="profile-perfect-count">0</strong></div>
                </div>
                <div class="chart-wrapper" style="width: 280px; margin: 0 auto;">
                    <canvas id="posePreferenceChart"></canvas>
                </div>
            </div>

            <!-- 歷史紀錄 -->
            <div id="history-container" class="dashboard-panel" style="display: none;">
                <h2>📊 我的練習進度 (最近 7 次)</h2>
                <canvas id="historyChart"></canvas>
                <h3 style="margin-top: 20px;">📜 歷史明細</h3>
                <ul id="history-list" class="history-list"><li>載入中...</li></ul>
            </div>

            <!-- 全球排行榜 -->
            <div id="leaderboard-container" class="dashboard-panel" style="display: none;">
                <h2>🏆 全球瑜珈大師排行榜</h2>
                <ul id="leaderboard-list" class="leaderboard-list"><li>載入中...</li></ul>
            </div>
        </div>

        <!-- 下方動作卡片區域 (3 個動作) -->
        <main class="actions-section">
            <div class="section-title-wrap">
                <h3>選擇訓練動作</h3>
                <p>點擊動作卡片即可進入 AI 鏡頭偵測練習</p>
            </div>
            <div id="actions-grid" class="actions-grid">
                <!-- 3 個動作卡片由 JS 動態生成 -->
            </div>
        </main>
    </div>

    <!-- 3. 訓練偵測室 (Workout View) - 參照圖一大字版排版 -->
    <div id="workout-view" style="display: none;">
        
        <!-- 左側操作區 -->
        <aside class="workout-sidebar">
            <h2 class="sidebar-title">操作區</h2>
            
            <div class="sidebar-search">
                <span class="search-icon">🔍</span>
                <span id="current-workout-title" class="search-text">大樹式</span>
            </div>
            
            <div class="sidebar-controls">
                <button class="action-btn btn-brown" id="btn-re-intro">教學</button>
            </div>
            
            <div class="sidebar-footer">
                <button id="btn-back-home" class="sidebar-btn btn-outline" style="width: 100%;">⬅️ 返回動作選單</button>
            </div>
        </aside>

        <!-- 右側主畫面區 -->
        <main class="workout-main">
            <div class="video-header">鏡頭 / 動作偵測</div>
            <div id="video-container">
                <div id="loading">啟動鏡頭與 AI 模型中...</div>
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
            </div>
            
            <!-- 超大字幕提示區 -->
            <div id="huge-prompt-container">
                <div class="prompt-badges">
                    <span id="prompt-badge-1" class="badge-gray">等待</span>
                    <span id="prompt-badge-2" class="badge-gray">偵測</span>
                </div>
                <div id="prompt-message" class="prompt-message-gray">請站到鏡頭前並準備開始</div>
            </div>
        </main>
    </div>

    <!-- 教學引導彈窗 -->
    <div id="intro-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 id="intro-title">動作名稱</h2>
            <div id="intro-media-wrapper">
                <video id="intro-video" autoplay loop muted playsinline style="display: none;"></video>
                <img id="intro-image" alt="Pose Demonstration" style="display: none;">
            </div>
            <p id="intro-desc">動作簡介載入中...</p>
            <ul id="intro-tips" class="intro-tips-list"></ul>
            <button id="intro-start-btn" class="start-btn" style="margin-top: 15px;">我準備好了，開始倒數！</button>
        </div>
    </div>

    <!-- 3 秒倒數計時遮罩 -->
    <div id="countdown-overlay" class="modal-overlay" style="display: none;">
        <div id="countdown-number" class="countdown-bounce">3</div>
    </div>

</body>
</html>
